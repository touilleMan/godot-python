repos:
  - repo: builtin
    hooks:

    - id: mixed-line-ending

    - id: trailing-whitespace
      exclude: ^tests/.*/expected.output

  - repo: local
    hooks:

    - id: git_actions_pin
      name: "Gitub actions pin 3rd party repos"
      entry: python ./misc/pin_github_actions.py check
      language: python
      language_version: python3
      files: ^.github/

    - id: lint
      name: lint (using `uv run ruff check`)
      entry: uv run ruff check --fix
      require_serial: true
      language: system
      types_or: [python, pyi]
      # TODO: repl_addon is all broken for the moment
      exclude: ^src/repl_addon/

    - id: format
      name: format (using `uv run ruff format`)
      entry: uv run ruff format
      require_serial: true
      language: system
      types_or: [python, pyi]
      args: [--config=pyproject.toml]
