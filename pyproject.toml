# ⚠️ Here we define a Python project that will be used to build Godot-Python,
# run the tests etc.
# Hence those dependencies are not going to be part of the final distribution
# used by end-users.
[project]
name = "godot-python-dev"
version = "0.1.0"  # Dummy version, actual one is defined in `meson.build`
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "meson~=1.5",
    # Colorama is needed only on Windows by autopxd2->click->pip-tools
    # see: https://github.com/pallets/click/blob/030f53cf677ee1de534359c535d465eed0ec1d99/setup.py#L6
    "colorama~=0.4",
    "ninja~=1.11",
    "cython~=3.1",
    "jinja2~=3.1",
    "zstandard~=0.23",
    "autopxd2~=2.5",
    # Setuptools is used in `tests/3-init-with-cython-hook/` to build a native module from Cython
    "setuptools>=80.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.uv.workspace]
members = [
    "libgodot/",
]
